<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>C2C 双开实战对线大厅</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; display: flex; justify-content: center; gap: 30px; padding: 20px; background-color: #e9ecef; }
        .chat-box { width: 380px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; text-align: center; color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px;}
        .form-group { margin-bottom: 12px; }
        .form-group input { width: calc(100% - 18px); padding: 8px; border: 1px solid #ced4da; border-radius: 5px; }
        button { width: 100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; transition: 0.2s; }
        .btn-connect { background-color: #28a745; margin-bottom: 10px;}
        .btn-connect:hover { background-color: #218838; }
        .btn-send { background-color: #007bff; }
        .btn-send:hover { background-color: #0069d9; }
        .messages { height: 300px; border: 1px solid #eee; background: #f8f9fa; overflow-y: auto; padding: 10px; margin-bottom: 15px; border-radius: 5px; }
        .msg-item { margin-bottom: 10px; font-size: 14px; line-height: 1.5; }
        .sys { color: #6c757d; font-size: 12px; text-align: center;}
        .me { color: #007bff; font-weight: bold; text-align: right;}
        .other { color: #fd7e14; font-weight: bold; background: #fff3cd; display: inline-block; padding: 5px 10px; border-radius: 5px;}
    </style>
</head>
<body>
<div class="chat-box">
    <h3>🛒 买家手机 (用户A)</h3>
    <div class="form-group">
        <input type="text" id="token1" placeholder="粘贴买家的 JWT Token (不用加Bearer)">
    </div>
    <button class="btn-connect" onclick="connect(1)">1. 登录并绑定通道</button>
    <div class="messages" id="msgArea1"></div>
    <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input type="text" id="targetId1" placeholder="发给谁(填ID)" style="width: 30%;">
        <input type="text" id="content1" placeholder="输入砍价内容..." style="width: 70%;">
    </div>
    <button class="btn-send" onclick="sendMsg(1)">2. 发送消息</button>
</div>

<div class="chat-box">
    <h3>🏪 卖家手机 (用户B)</h3>
    <div class="form-group">
        <input type="text" id="token2" placeholder="粘贴卖家的 JWT Token (不用加Bearer)">
    </div>
    <button class="btn-connect" onclick="connect(2)">1. 登录并绑定通道</button>
    <div class="messages" id="msgArea2"></div>
    <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input type="text" id="targetId2" placeholder="发给谁(填ID)" style="width: 30%;">
        <input type="text" id="content2" placeholder="输入回复内容..." style="width: 70%;">
    </div>
    <button class="btn-send" onclick="sendMsg(2)">2. 回复消息</button>
</div>

<script>
    let ws1 = null, ws2 = null;

    function connect(clientNum) {
        let token = document.getElementById("token" + clientNum).value.trim();
        if(!token) return alert("必须先填入 Token 才能进入大厅！");

        let ws = new WebSocket("ws://127.0.0.1:9090/ws");
        if(clientNum === 1) ws1 = ws; else ws2 = ws;

        ws.onopen = function() {
            appendMsg(clientNum, "sys", "正在呼叫服务器进行身份认证...");
            // 🚨 核心：构造 Type=1 的认证消息
            ws.send(JSON.stringify({ type: 1, token: token }));
        };

        ws.onmessage = function(e) {
            appendMsg(clientNum, "other", e.data);
        };

        ws.onclose = function() {
            appendMsg(clientNum, "sys", "🔴 连接已断开，请检查后端服务");
        };
    }

    function sendMsg(clientNum) {
        let ws = clientNum === 1 ? ws1 : ws2;
        if(!ws || ws.readyState !== WebSocket.OPEN) return alert("请先点击绿色按钮登录！");

        let targetId = document.getElementById("targetId" + clientNum).value;
        let content = document.getElementById("content" + clientNum).value;
        if(!targetId || !content) return alert("目标ID和消息都不能空着！");

        // 🚨 核心：构造 Type=2 的私聊消息
        ws.send(JSON.stringify({ type: 2, toUserId: parseInt(targetId), content: content }));

        appendMsg(clientNum, "me", "我: " + content);
        document.getElementById("content" + clientNum).value = ""; // 发完清空输入框
    }

    function appendMsg(clientNum, typeClass, text) {
        let div = document.getElementById("msgArea" + clientNum);
        div.innerHTML += `<div class="msg-item ${typeClass}">${text}</div>`;
        div.scrollTop = div.scrollHeight;
    }
</script>
</body>
</html>
