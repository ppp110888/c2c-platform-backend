server:
  port: 8080 # 网关统一入口端口

spring:
  application:
    name: gateway-service # 网关在 Nacos 中的名字

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848 # Nacos 地址

    gateway:
      routes:
        # 1. 用户服务路由
        - id: user_service_route
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1

        # 2. 商品服务路由
        - id: item_service_route
          uri: lb://item-service
          predicates:
            - Path=/api/item/**
          filters:
            - StripPrefix=1

        # 3. 订单服务路由
        - id: order_service_route
          uri: lb://order-service
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1

        # ==========================================
        # 4. 新增：消息服务路由 (大动脉贯通！)
        # ==========================================
        - id: message_service_route
          uri: lb://message-service
          predicates:
            - Path=/api/message/**
          filters:
            - StripPrefix=1

security:
  internal-secret: ${INTERNAL_API_SECRET}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
