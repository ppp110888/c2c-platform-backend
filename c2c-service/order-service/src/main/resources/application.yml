server:
  port: 8083
  address: 127.0.0.1

spring:
  application:
    name: order-service
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/c2c_order?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}

  # Redis 属于 spring 层级
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 支付宝沙箱配置
alipay:
  appId: ${ALIPAY_APP_ID}
  privateKey: ${ALIPAY_PRIVATE_KEY}
  publicKey: ${ALIPAY_PUBLIC_KEY}
  gatewayUrl: "https://openapi-sandbox.dl.alipaydev.com/gateway.do"
  signType: "RSA2"
  charset: "utf-8"
  # 异步回调地址：本地测试用内网穿透（ngrok/natapp）替换占位符；同步 return 已能完成支付确认
  notifyUrl: "http://你的公网IP或者内网穿透地址/api/order/alipay/notify"
  returnUrl: "http://localhost:8080/"
  # 新增：前端地址 & 验签开关
  frontendUrl: "http://localhost:5173"   # 支付完成后重定向回前端
  verifySign: true

security:
  internal-secret: ${INTERNAL_API_SECRET}
