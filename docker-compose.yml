version: '3.8'

# ============================================================
# C2C 开发环境 — 中间件 Docker Compose
# 后端服务从 IDE 启动，中间件全部容器化
#
# 启动: docker compose up -d
# 停止: docker compose down
# 重启: docker compose restart
# 清空全部数据重新开始: docker compose down -v
# ============================================================

services:
  # ==========================================
  # MySQL 8.0 — 3 个库: c2c_user / c2c_item / c2c_order
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: c2c-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis 7 — 缓存 & Redisson 分布式锁
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: c2c-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 3

  # ==========================================
  # MongoDB 7 — message-service
  # ==========================================
  mongodb:
    image: mongo:7
    container_name: c2c-mongodb
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      retries: 5

  # ==========================================
  # Elasticsearch 8.11 — 商品搜索
  # ==========================================
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: c2c-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ==========================================
  # MinIO — 对象存储（图片）
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: c2c-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5

  # ==========================================
  # Nacos 2.3.2 — 注册中心
  # ==========================================
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: c2c-nacos
    restart: unless-stopped
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    volumes:
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ==========================================
  # RocketMQ NameServer
  # ==========================================
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: c2c-rmq-namesrv
    restart: unless-stopped
    ports:
      - "127.0.0.1:9876:9876"
    volumes:
      - rmq-namesrv-data:/home/rocketmq/logs
    command: sh mqnamesrv

  # ==========================================
  # RocketMQ Broker
  # ==========================================
  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: c2c-rmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    ports:
      - "127.0.0.1:10911:10911"
      - "127.0.0.1:10909:10909"
    environment:
      - NAMESRV_ADDR=rocketmq-namesrv:9876
      - TZ=Asia/Shanghai
    volumes:
      - rmq-broker-data:/home/rocketmq/logs
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.1.4/conf/broker.conf:ro
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.1.4/conf/broker.conf

volumes:
  mysql-data:
  redis-data:
  mongodb-data:
  es-data:
  minio-data:
  nacos-logs:
  rmq-namesrv-data:
  rmq-broker-data:
